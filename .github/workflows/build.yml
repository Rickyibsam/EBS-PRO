name: EBS PRO build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Commit generated lockfile to same-repository PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'package-lock.json';
            const content = fs.readFileSync(path, 'utf8');
            const { owner, repo } = context.repo;
            const branch = context.payload.pull_request.head.ref;
            let existing = null;
            try {
              const response = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (!Array.isArray(response.data)) existing = response.data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (existing?.sha) {
              const current = Buffer.from(existing.content || '', 'base64').toString('utf8');
              if (current === content) {
                core.info('package-lock.json is already up to date.');
                return;
              }
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path, branch, sha: existing.sha,
                message: 'build: lock npm dependency resolution',
                content: Buffer.from(content).toString('base64')
              });
            } else {
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path, branch,
                message: 'build: lock npm dependency resolution',
                content: Buffer.from(content).toString('base64')
              });
            }
      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Run automated unit tests
        run: npm test
      - name: Build application
        run: npm run build
      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium
      - name: Run production browser and mobile-emulation smoke tests
        run: npm run test:e2e
        env:
          EBS_PRO_BASE_URL: https://ebs-pro.onrender.com
